<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qur'an</title>
  <meta name="theme-color" content="#1F1A18">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- TRYOUT: Scheherazade New is only here for the phase 3 options; keep just the chosen Arabic font. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cinzel:wght@500&family=Jost:wght@300;400&family=Scheherazade+New&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
  <!-- TEMPORARY, local preview only: phase 5 ending options. Delete this line and ending-options.js once the
       ending is chosen. -->
  <script src="ending-options.js" defer></script>
  <script src="atmosphere.js" defer></script>
  <!-- TEMPORARY, local preview only: headline/subline picker. Delete this line and
       wordmark-options.js once a choice is locked in. -->
  <script src="wordmark-options.js" defer></script>
</head>
<body>
  <main>
    <section class="hero">
      <div class="stage">
        <!-- Chosen by the user 2026-09-13. The site name comes later, from a separate chat.
             Headline/subline under review again 2026-09-13 (idea-refine) — see the picker panel. -->
        <header class="wordmark">
          <h1>From Alif to Ayah</h1>
          <p>A real teacher, one letter at a time, until the verses are yours.</p>
        </header>
        <!-- .book makes room for the ending in the "Under the book" option; atmosphere.js moves .subject while still. -->
        <div class="book">
          <div class="subject">
            <canvas role="img" aria-label="A black leather Qur'an with a gold roundel on its cover, opening to two cream pages."></canvas>
          </div>
        </div>
      </div>
    </section>
    <!-- Phase 5: the ending. Both links are stand-ins until the pages exist. At launch, point them at the real pages,
         and hide the Qaida button if the Qaida isn't live yet. -->
    <section class="close" aria-labelledby="close-line">
      <div class="inner">
        <h2 id="close-line">Learn to read these pages for yourself.</h2>
        <div class="entry">
          <a class="button primary lessons" href="#lessons">One-to-one lessons</a>
          <a class="button qaida" href="#qaida">Free Qaida</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
